#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
    # Enter: папка -> войти, файл -> открыть/выбрать (важно для chooser-режима)
    { on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },
    { on = "l",       run = "plugin smart-enter", desc = "Enter directory or open file" },

    # Вкладка в текущей директории (как было)
    { on = "t", run = "tab_create --current", desc = "New tab in CWD" },

    # Быстрые переходы
    { on = [ "g", "p" ], run = "cd ~/Projects",      desc = "Go Projects" },
    { on = [ "g", "l" ], run = "cd ~/Projects/Labs", desc = "Go Labs" },

    # Плагины
    { on = "T",           run = "plugin toggle-pane max-preview", desc = "Maximize preview" },
    { on = [ "c", "m" ],  run = "plugin chmod",                   desc = "Change permissions" },
    { on = "C",           run = "plugin ouch",                    desc = "Compress with ouch" },
    { on = [ "g", "r" ],  run = "plugin restore",                 desc = "Restore from trash" },
]
