# ============================================================================
#  tmux — конфиг
#  Префикс: C-b (по умолчанию)
#  Плагины: TPM (sensible, resurrect, continuum, yank)
#  Тема: Material 3 (палитра из ~/.config/hypr/scheme/current.lua)
# ============================================================================


# ---------------------------------------------------------------------------
#  Терминал и совместимость
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -as terminal-overrides ',*:Tc'

# truecolor + extended keys + passthrough (kitty graphics, например yazi/nvim)
set -g extended-keys on
set -g allow-passthrough on

# Быстрый выход из режимов (важно для nvim)
set -g escape-time 10

# ---------------------------------------------------------------------------
#  Общие настройки
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000
set -g focus-events on
set -sg repeat-time 600

set -g mouse on
set -g set-clipboard on
set -s copy-command 'wl-copy'
set -g assume-paste-time 1

setw -g mode-keys vi
setw -g clock-mode-style 24

# Заголовок окна терминала
set -g set-titles on
set -g set-titles-string '#S:#I.#P — #W'

# Имена окон: nvim/yazi/ssh и т.п.; для обычного shell — имя текущей папки.
# Приложениям не даём переименовывать окна вручную.
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m/r:^(fish|bash|zsh|sh|dash|ksh|nu)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Индикация активности
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

set -g display-time 2000
set -g status-interval 5
set -g detach-on-destroy off

# ---------------------------------------------------------------------------
#  Навигация: Alt+h/j/k/l — панели, Alt+Shift+h/j/k/l — размер.
#  В kitty эти комбинации не назначены, поэтому доходят до tmux.
# ---------------------------------------------------------------------------
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# То же с префиксом — на случай, если Alt перехватит приложение
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# ---------------------------------------------------------------------------
#  Окна и панели
# ---------------------------------------------------------------------------
# Новое окно/панель — в текущей директории
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Перемещение окна влево/вправо
bind -r '<' swap-window -t -1 \; select-window -t -1
bind -r '>' swap-window -t +1 \; select-window -t +1

# L — последнее окно (l занята навигацией по панелям)
bind L last-window

# Alt+1..9 — переключение окон (kitty эти комбинации не перехватывает)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Синхронизация ввода во все панели окна
bind S setw synchronize-panes \; \
    display-message "synchronize-panes: #{?synchronize-panes,включено,выключено}"

# ---------------------------------------------------------------------------
#  Копирование (vi-режим + Wayland clipboard)
# ---------------------------------------------------------------------------
# Эти бинды — запасные; tmux-yank переопределит их на свои (тоже wl-copy).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'wl-copy'

# ---------------------------------------------------------------------------
#  Перезагрузка конфига
# ---------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Конфиг tmux перезагружен"

# ---------------------------------------------------------------------------
#  Оформление (серая монохромная тема, квадратные блоки без стрелок)
#  base #141317 · surface #1c1b1f · surface0 #262529 · surface1 #38373c
#  surface2 #47454f · outline #928f9a · text #e5e1e7 · subtext #c9c5d0
# ---------------------------------------------------------------------------
set -g status-position bottom
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100

# Основной стиль статус-бара (sumiInk0 / fujiWhite)
set -g status-style 'bg=#16161D,fg=#DCD7BA'

# Статус слева: имя сессии в цвете морской волны (waveBlue2)
set -g status-left  '#[bg=#2D4F67,fg=#DCD7BA,bold] #S '

# Статус справа: PREFIX загорается красным (autumnRed), ZOOM — оранжевым (surimiOrange)
set -g status-right '#{?client_prefix,#[bg=#FF5D62,fg=#16161D,bold] PREFIX ,}#[fg=#727169]#{?window_zoomed_flag,#[fg=#FFA066]ZOOM  ,}%d.%m  #[fg=#DCD7BA,bold]%H:%M '

# Список окон
set -g window-status-separator ''
# Неактивные окна (fujiGray)
setw -g window-status-format         '#[fg=#727169] #I:#W#{?window_flags, #[fg=#7E9CD8]#{window_flags},} '
# Активное окно (акцентный waveAqua / sumiInk0)
setw -g window-status-current-style  'bg=#7AA89F,fg=#16161D,bold'
setw -g window-status-current-format '#[bg=#7AA89F,fg=#16161D,bold] #I:#W#{?window_flags, #[fg=#16161D]#{window_flags},} '
# Уведомления и активность
setw -g window-status-activity-style 'fg=#E6C384,bold'
setw -g window-status-bell-style     'fg=#FF5D62,bold'

# Рамки панелей
set -g pane-border-lines        heavy
set -g pane-border-style        'fg=#2A2A37'   # Неактивная граница (sumiInk3 — темная, не отвлекает)
set -g pane-active-border-style 'fg=#7AA89F'   # Активная граница (waveAqua)

# Сообщения, командная строка и режим выделения
set -g message-style         'bg=#2A2A37,fg=#DCD7BA'
set -g message-command-style 'bg=#2A2A37,fg=#DCD7BA'
set -g mode-style            'bg=#2D4F67,fg=#DCD7BA,bold' # Цвет выделения текста в Neovim

# Поиск в режиме копирования (по аналогии с Neovim Search)
set -g copy-mode-match-style         'bg=#2D4F67,fg=#DCD7BA'
set -g copy-mode-current-match-style 'bg=#FF9E3B,fg=#16161D,bold' # Текущее совпадение (roninYellow)
set -g copy-mode-mark-style          'bg=#7AA89F,fg=#16161D'

# Часы и отображение номеров панелей
set -g clock-mode-colour           '#7E9CD8'   # crystalBlue
set -g display-panes-colour        '#2D4F67'
set -g display-panes-active-colour '#7AA89F'
# ---------------------------------------------------------------------------
#  Плагины
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# --- resurrect / continuum ---
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'
set -g @resurrect-processes 'ssh mosh'
set -g @resurrect-strategy-nvim 'session'

# Автосохранение каждые 15 минут и автовосстановление после перезагрузки
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @continuum-boot 'off'

# --- tmux-yank ---
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'

# TPM должен быть последней строкой конфига
# (при XDG-конфиге плагины лежат в ~/.config/tmux/plugins)
run '~/.config/tmux/plugins/tpm/tpm'
