shell_integration no-cursor

# CURSOR ANIMATIONS
cursor_trail 10
cursor_trail_start_threshold 0
cursor_trail_declay 0.01 0.05
# cursor_shape block 
cursor_blinck true

# FONT
font_size 13
font_family Hasklug Nerd Font

background_opacity 0.90

# OS CLOSE CONFIRMATION
confirm_os_window_close 0

# window_padding_width 0 0 15 0


enabled_layouts splits,tall,stack

map ctrl+shift+n launch --type=os-window --cwd=current
map ctrl+alt+v launch --location=vsplit

map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backspace launch --location=hsplit --cwd=current

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

map ctrl+shift+t new_tab_with_cwd

remember_window_size no
